# CI for dependably-spec.
#
# This repository ships no code, so there is nothing to build or test in the usual sense.
# What it can do is keep the contract internally consistent: the corpus, the JSON schema and
# the spec document all describe the same thing, and it is easy to change one and forget the
# others. `validate` parses the registries out of the spec and checks the rest against them.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible

default:
  image: python:3.13-alpine
  interruptible: true

stages:
  - validate
  - mirror

validate:
  stage: validate
  script:
    - python3 tools/validate.py

# Verified-secret scan, matching the digest every tool repository pins so the scanner version
# is a single source of truth across the suite.
secret-scan:
  stage: validate
  image:
    name: trufflesecurity/trufflehog:3.95.3@sha256:9cc33bb080cac0efbbf228a17667172875b529eeeab01efcc4697adfb55f568a
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - |
      BEFORE="${CI_COMMIT_BEFORE_SHA}"
      if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
        echo "No usable base commit (first push / force-push) — scanning full history"
        trufflehog git file://. --only-verified --fail
      else
        trufflehog git file://. --since-commit "$BEFORE" --only-verified --fail
      fi

# Mirror to the public GitHub repository. The contract is what consumers vendor from, so it
# needs to be reachable from the same place the tools are. Manual on the default branch,
# automatic on a tag.
mirror-to-github:
  stage: mirror
  image: alpine:3
  interruptible: false
  resource_group: mirror-to-github
  variables:
    GIT_DEPTH: 0
  needs:
    - job: validate
    - job: secret-scan
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
  script:
    - apk add --no-cache git
    - |
      if [ -z "$GITHUB_TOKEN" ]; then
        echo "ERROR: GITHUB_TOKEN must be set as a CI/CD variable (Contents:write on dependably/dependably-spec)." >&2
        exit 1
      fi
    - |
      set -eu
      # Token is passed via the remote URL (not echoed); GitLab masks the variable in logs.
      git remote remove github 2>/dev/null || true
      git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/dependably/dependably-spec.git"
      git push github "HEAD:refs/heads/${CI_DEFAULT_BRANCH}"
      git push github --tags
      git remote remove github
